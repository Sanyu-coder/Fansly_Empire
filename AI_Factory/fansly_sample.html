        <app-root>
            <!--::TODO add inline javascript to apply theme class to loading spinner-->
            <div class="loading-wrapper">
                <div class="loading-content">
                    <img class="dark-theme-only" width="2856" height="798" src="/assets/images/fansly_dark_v3.webp">
                    <img class="bright-theme-only" width="2856" height="798" src="/assets/images/fansly_light_v3.webp">

                    <i class="fa-fw fal fa-spinner-third fa-spin fa-3x margin-top-2"></i>
                </div>
            </div>
        </app-root>

        <script>
            (function() {
                var checkCount = 0;
                var checkTheme = function() {
                    checkCount++;

                    if (checkCount > 50) {
                        return;
                    }

                    var htmlElement = document.getElementsByTagName("html")[0];
                    var bodyElement = document.getElementsByTagName("body")[0];

                    var getMeta = function(metaName) {
                        const metas = document.getElementsByTagName("meta");

                        for (let i = 0; i < metas.length; i++) {
                            if (metas[i].getAttribute("name") === metaName) {
                                return metas[i];
                            }
                        }

                        return null;
                    };

                    let themeMetaElement = getMeta("theme-color");

                    if (htmlElement && bodyElement && themeMetaElement) {
                        //if (htmlElement) {
                        var defaultTheme = "bright";
                        if (window && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                            // dark mode
                            defaultTheme = "dark";
                        }

                        var availableThemes = ["bright", "dark"];
                        var currentTheme = localStorage
                            ? localStorage.getItem("theme_service_current_theme") || defaultTheme
                            : defaultTheme;

                        if (!currentTheme || currentTheme === "null" || availableThemes.indexOf(currentTheme) < 0) {
                            currentTheme = defaultTheme;
                        }

                        if (currentTheme === "bright" && htmlElement.className.indexOf("bright-theme") === -1) {
                            htmlElement.className += " bright-theme";
                        } else if (currentTheme === "dark" && htmlElement.className.indexOf("dark-theme") === -1) {
                            htmlElement.className += " dark-theme";
                        }

                        if (themeMetaElement && currentTheme === "bright") {
                            themeMetaElement.setAttribute("content", "#ffffff");
                        } else if (themeMetaElement && currentTheme === "dark") {
                            themeMetaElement.setAttribute("content", "#16161a");
                        }
                    } else {
                        setTimeout(function() {
                            checkTheme();
                        }, 50);
                    }
                };

                checkTheme();
